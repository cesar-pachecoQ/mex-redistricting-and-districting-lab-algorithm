[project]
name = "redistricting-lab"
version = "0.1.0"
description = "Laboratorio de distritacion y redistritacion para Mexico"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.3",
  "numpy>=2.0",
  "scipy>=1.14",
  "pydantic>=2.10",
  "pulp>=3.0",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyarrow>=20.0",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "folium>=0.17",
  "plotly>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]

[project.scripts]
redistricting-lab = "redistricting_lab.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redistricting_lab"]

[tool.ruff]
line-length = 100
